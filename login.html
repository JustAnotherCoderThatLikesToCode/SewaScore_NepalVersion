<style>
  :root{
    --accent-a:#06b6d4;
    --accent-b:#7c3aed;
    --accent-c:#ec4899;
    --bg-white:#ffffff;
  }
  html,body{height:100%;margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;}
  body{background:var(--bg-white); color:#0f172a; overflow-x:hidden;}

  /* Background root + layers (same as signup) */
  .bg-root{position:fixed;inset:0;pointer-events:none;z-index:-20;overflow:hidden}
  .bg-parallax{position:absolute;inset:0;transition:transform .12s linear;will-change:transform}
  .aurora{position:absolute;inset:-30%;mix-blend-mode:screen;filter:blur(36px) saturate(1.45);
    background:
      radial-gradient(1100px 520px at 12% 12%, rgba(6,182,212,0.78), transparent 30%),
      radial-gradient(1200px 540px at 88% 18%, rgba(124,58,237,0.72), transparent 30%),
      radial-gradient(900px 480px at 50% 82%, rgba(236,72,153,0.48), transparent 30%);
    animation:auroraShift 16s ease-in-out infinite alternate; opacity:0.95; will-change:transform;}
  @keyframes auroraShift{0%{transform:translate3d(-3%,-4%,0) scale(1)}100%{transform:translate3d(3%,4%,0) scale(1.05)}}

  .fog-layer{position:absolute;inset:0;z-index:-18;will-change:transform}
  .fog-blob{position:absolute;border-radius:50%;

  .dust.large{width:10px;height:10px;opacity:.95;filter:blur(1.2px)}

  .orb-layer{position:absolute;inset:0;z-index:-15;will-change:transform}
  .orb{position:absolute;border-radius:50%;filter:blur(6px) saturate(1.1);will-change:transform,opacity;mix-blend-mode:screen;box-shadow:0 8px 40px rgba(0,0,0,0.06);border:1px solid rgba(255,255,255,0.12);}

  /* Card (mirrors signup card exactly) */
  .signup-card-wrap{position:relative;z-index:10;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:40px 20px;}

    width:540px; max-width:94%; margin:0 auto; padding:46px 40px; border-radius:20px;

    position:relative; overflow:visible; z-index:2147483647 !important;
    isolation:isolate; transform-style:preserve-3d; -webkit-transform: translateZ(0); transform: translateZ(0);
    will-change: transform, box-shadow; transition: transform 260ms cubic-bezier(.2,.9,.2,1), box-shadow 260ms cubic-bezier(.2,.9,.2,1);

  .signup-card::before{
    content:""; position:absolute; inset:-2px; border-radius:22px; padding:2px;
    background: linear-gradient(90deg, rgba(6,182,212,0.14), rgba(124,58,237,0.14), rgba(236,72,153,0.08));
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);

    animation: borderPulse 6s ease-in-out infinite alternate;

  @keyframes borderPulse{0%{filter:blur(8px);opacity:.85}100%{filter:blur(18px);opacity:1}}

  .shimmer{ position:absolute; left:-40%; top:-10%; width:200%; height:40%; background: linear-gradient(90deg, rgba(255,255,255,0.02), rgba(255,255,255,0.12), rgba(255,255,255,0.02)); transform:rotate(-12deg); pointer-events:none; mix-blend-mode:overlay; animation:shimmerMove 6s linear infinite; border-radius:40%; }
  @keyframes shimmerMove{0%{transform:translateX(-20%) rotate(-12deg)}100%{transform:translateX(20%) rotate(-12deg)}}

  h2{margin:0 0 12px 0;font-size:2.4rem;font-weight:900;text-align:center;background:linear-gradient(90deg,var(--accent-a),var(--accent-b));-webkit-background-clip:text;color:transparent;filter: drop-shadow(0 6px 18px rgba(124,58,237,0.12));letter-spacing:-0.6px;}

<script>
function rand(min,max){return Math.random()*(max-min)+min}

/* Fog */
(function fog(){
  const root=document.getElementById('fogLayer');
  if(!root) return;
  root.innerHTML='';
  for(let i=0;i<10;i++){
    const b=document.createElement('div');
    b.className='fog-blob';
    const w=Math.round(rand(220,640));
    const h=Math.round(w*rand(.45,.85));
    b.style.width=w+'px';
    b.style.height=h+'px';
    b.style.left=(rand(-.12,1.12)*100)+'%';
    b.style.top=(rand(-.05,0.6)*100)+'%';
    b.style.opacity = rand(0.06,0.18).toFixed(2);
    root.appendChild(b);
  }
})();

/* Dust */
(function dust(){
  const root=document.getElementById('dustLayer');
  if(!root) return;
  root.innerHTML='';
  for(let i=0;i<80;i++){
    const d=document.createElement('div');
    d.className='dust';
    if(Math.random()<.12) d.classList.add('large');
    else if(Math.random()<.35) d.classList.add('small');
    d.style.left=(Math.random()*100)+'%';
    d.style.top=(rand(0,1)*100)+'%';
    d.style.opacity = rand(0.06,0.18).toFixed(2);
    root.appendChild(d);
  }
})();

/* Orbs */
(function orbs(){
  const root=document.getElementById('orbLayer');
  if(!root) return;
  root.innerHTML='';
  for(let i=0;i<20;i++){
    const o=document.createElement('div');
    o.className='orb';
    const size=Math.round(rand(28,88));
    o.style.width=size+'px';
    o.style.height=size+'px';
    o.style.left=(Math.random()*100)+'%';
    o.style.top=(rand(0,1)*100)+'%';
    o.style.opacity = rand(0.6,1).toFixed(2);
    const hue=Math.round(rand(180,320));
    o.style.background=`radial-gradient(circle at 30% 30%, rgba(255,255,255,.95), hsla(${hue},85%,80%,.95) 35%, hsla(${hue},85%,70%,.28) 70%, transparent)`;
    root.appendChild(o);
  }
})();

/* ---------- Parallax ---------- */
(function parallax(){
  const aur = document.getElementById('aurora'),
        fog = document.getElementById('fogLayer'),
        dust = document.getElementById('dustLayer'),
        orbs = document.getElementById('orbLayer'),
        bgPar = document.getElementById('bgParallax'),
        card = document.querySelector('.signup-card');

  if (!bgPar) return;

  let targetX = 0, targetY = 0;
  let currentX = 0, currentY = 0;
  let t = 0;
  let paused = false;
  let lastMove = 0;

  function setNeutralTransforms(){
    if (aur) aur.style.transform = 'translate3d(0,0,0)';
    if (fog) fog.style.transform = 'translate3d(0,0,0)';
    if (dust) dust.style.transform = 'translate3d(0,0,0)';
    if (orbs) orbs.style.transform = 'translate3d(0,0,0)';
    if (bgPar) bgPar.style.transform = 'rotateX(0deg) rotateY(0deg)';
  }
  setNeutralTransforms();

  function onMove(e){
    if (paused) return;
    if (e.target && e.target.closest && e.target.closest('.signup-card')) return;
    const now = performance.now();
    if (now - lastMove < 12) return;
    lastMove = now;
    targetX = ((e.clientX || innerWidth/2) / innerWidth) - 0.5;
    targetY = ((e.clientY || innerHeight/2) / innerHeight) - 0.5;
  }
  window.addEventListener('mousemove', onMove, { passive: true });

  function pauseUpdates(){
    if (paused) return;
    paused = true;
    targetX = 0; targetY = 0;
    setNeutralTransforms();
  }
  function resumeUpdates(){
    if (!paused) return;
    paused = false;
    targetX = 0; targetY = 0;
  }

  if (card) {
    card.addEventListener('pointerenter', pauseUpdates, { passive: true });
    card.addEventListener('pointerleave', resumeUpdates, { passive: true });
    card.addEventListener('pointerdown', pauseUpdates, { passive: true });
    card.addEventListener('pointerup', resumeUpdates, { passive: true });
    card.addEventListener('focusin', pauseUpdates);
    card.addEventListener('focusout', resumeUpdates);
    card.addEventListener('pointermove', function(e){ e.stopPropagation(); }, { passive: true });
  }

  function lerp(a,b,n){ return (1-n)*a + n*b; }

  function rafLoop(){
    currentX = lerp(currentX, targetX, 0.12);
    currentY = lerp(currentY, targetY, 0.12);

    t += 0.006;
    const idleX = paused ? 0 : Math.sin(t * 0.9) * 0.02;
    const idleY = paused ? 0 : Math.cos(t * 0.7) * 0.02;

    const px = currentX + idleX;
    const py = currentY + idleY;

    if (aur) aur.style.transform = `translate3d(${px * 6}%, ${py * 4}%, 0)`;
    if (fog) fog.style.transform = `translate3d(${px * 10}%, ${py * 6}%, 0)`;
    if (dust) dust.style.transform = `translate3d(${px * 14}%, ${py * 10}%, 0)`;
    if (orbs) orbs.style.transform = `translate3d(${px * 18}%, ${py * 12}%, 0)`;
    if (bgPar) bgPar.style.transform = `rotateX(${py * 1.2}deg) rotateY(${px * 1.2}deg)`;

    requestAnimationFrame(rafLoop);
  }
  requestAnimationFrame(rafLoop);
})();

/* ---------- Login logic (OLD — kept exactly as you asked) ---------- */
(function login(){
  const btn = document.getElementById("loginBtn");
  const emailEl = document.getElementById("loginEmail");
  const passEl = document.getElementById("loginPassword");
  const err = document.getElementById("loginError");
  if(!btn) return;

  btn.addEventListener("click", () => {
    const email = (emailEl && emailEl.value || '').trim();
    const pass = (passEl && passEl.value) || '';

    if (!email || !pass) {
      showError("Please enter email and password.");
      return;
    }

    const storedEmail = localStorage.getItem("userEmail");
    const storedPass = localStorage.getItem("userPassword");

    if (!storedEmail || !storedPass) {
      showError("No account found. Create one first.");
      return;
    }

    if (email !== storedEmail || pass !== storedPass) {
      showError("Invalid credentials. Try again.");
      return;
    }

    btn.disabled = true;
    btn.textContent = "Signing in…";
    setTimeout(()=> { window.location.href = "pm.html"; }, 700);
  });

  function showError(msg){
    if (!err) return;
    err.textContent = msg;
    err.style.display = "block";
    setTimeout(()=> { err.style.display = "none"; }, 3000);
  }
})();

/* ---------- Popup-scale hover ---------- */
(function(){
  const card = document.querySelector('.signup-card');
  if (!card) return;
  let animated = false;
  function onEnter(){
    card.classList.add('popup-scale');
    if (!animated) {
      card.classList.add('animate');
      setTimeout(()=> card.classList.remove('animate'), 420);
      animated = true;
    }
  }
  function onLeave(){ card.classList.remove('popup-scale'); }
  card.addEventListener('pointerenter', onEnter, { passive: true });
  card.addEventListener('pointerleave', onLeave, { passive: true });
  card.addEventListener('focusin', onEnter);
  card.addEventListener('focusout', onLeave);
})();

/* ---------- Show/Hide password ---------- */
(function(){
  const toggle = document.getElementById('togglePwd');
  const pwd = document.getElementById('loginPassword');
  if (!toggle || !pwd) return;
  toggle.addEventListener('click', (e) => {
    e.preventDefault();
    const isPwd = pwd.type === 'password';
    pwd.type = isPwd ? 'text' : 'password';
    toggle.setAttribute('aria-label', isPwd ? 'Hide password' : 'Show password');
    pwd.focus({preventScroll:true});
  });
})();

/* ---------- Back button ---------- */
(function(){
  const back = document.querySelector('.card-back');
  if (!back) return;
  back.addEventListener('click', (e) => {
    e.preventDefault();
    if (window.history && window.history.length > 1) {
      window.history.back();
      setTimeout(() => {
        if (document.visibilityState === 'visible') {
          window.location.href = 'index.html';
        }
      }, 600);
      return;
    }
    window.location.href = 'index.html';
  }, { passive: true });
})();

/* ⭐⭐⭐ CLEAN REAL LOGIN + GUEST MODE ⭐⭐⭐ */

/* 1️⃣ Verification fail tracking */
let verifyFails = parseInt(localStorage.getItem("verifyFails") || "0");
let lockoutMinutes = parseInt(localStorage.getItem("lockoutMinutes") || "1");
let lockoutUntil = parseInt(localStorage.getItem("lockoutUntil") || "0");

/* Lockout check */
function checkLockout() {
  const now = Date.now();
  if (now < lockoutUntil) {
    const remaining = Math.ceil((lockoutUntil - now) / 60000);
    alert(`Too many failed attempts. Try again in ${remaining} minute(s).`);
    return true;
  }
  return false;
}

/* ⭐ REAL LOGIN BUTTON ⭐ */
document.getElementById("loginBtn").addEventListener("click", (event) => {
  event.stopImmediatePropagation();

  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value.trim();

  if (!email || !password) {
    alert("Please enter email and password.");
    return;
  }

  if (checkLockout()) return;

  fetch("login.php", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email, password })
  })
  .then(res => res.json())
  .then(data => {

    if (data.status === "not_found") {
      alert("Account doesn't exist.");
      return;
    }

    if (data.status === "wrong_password") {
      alert("Incorrect password.");
      return;
    }

    if (data.status === "exists") {
      window.isGuestMode = false;     
      window.loginEmail = email;      

      document.getElementById("verifyModal").style.display = "flex";
      loadChallenge();
    }
  });
});

/* ⭐ GUEST LOGIN BUTTON ⭐ */
document.getElementById("guestLoginBtn").onclick = () => {
  if (checkLockout()) return;

  window.isGuestMode = true;
  window.loginEmail = "Guest"; // store guest identity

  document.getElementById("verifyModal").style.display = "flex";
  loadChallenge();
};

/* ⭐ BOT CHECK IMAGE SYSTEM ⭐ */

const challenges = [
  { prompt: "Select the flag of Nepal", correct: "nepal_flag", options: ["nepal_flag","india_flag","china_flag"] },
  { prompt: "Select Mount Everest", correct: "everest", options: ["everest","random_mountain","himalaya"] },
  { prompt: "Select Kathmandu", correct: "kathmandu", options: ["kathmandu","pokhara","bhaktapur"] }
];

const imageMap = {
  nepal_flag: "https://upload.wikimedia.org/wikipedia/commons/9/9b/Flag_of_Nepal.svg",
  india_flag: "https://upload.wikimedia.org/wikipedia/en/4/41/Flag_of_India.svg",
  china_flag: "https://upload.wikimedia.org/wikipedia/commons/f/fa/Flag_of_the_People%27s_Republic_of_China.svg",
  everest: "https://i.imgur.com/8YQFQ8K.jpeg",
  random_mountain: "https://i.imgur.com/0ZQZQ0y.jpeg",
  himalaya: "https://i.imgur.com/8k7x1rF.jpeg",
  kathmandu: "https://i.imgur.com/1xg7x0P.jpeg",
  pokhara: "https://i.imgur.com/7p8x0kT.jpeg",
  bhaktapur: "https://i.imgur.com/4Q0n1mS.jpeg"
};

function loadChallenge() {
  if (checkLockout()) return;

  const modal = document.getElementById("verifyModal");
  const promptEl = document.getElementById("verifyPrompt");
  const imgContainer = document.getElementById("verifyImages");

  imgContainer.innerHTML = "";

  const challenge = challenges[Math.floor(Math.random() * challenges.length)];
  promptEl.textContent = challenge.prompt;

  const shuffled = [...challenge.options].sort(() => Math.random() - 0.5);

  shuffled.forEach(key => {
    const img = document.createElement("img");
    img.src = imageMap[key];
    img.style.width = "90px";
    img.style.height = "70px";
    img.style.objectFit = "cover";
    img.style.borderRadius = "8px";
    img.style.cursor = "pointer";

    img.onclick = () => {
      if (key === challenge.correct) {
        modal.style.display = "none";
        window.passVerification();
      } else {
        verifyFails++;
        localStorage.setItem("verifyFails", verifyFails.toString());

        if (verifyFails >= 5) {
          const now = Date.now();
          lockoutUntil = now + lockoutMinutes * 60000;

          localStorage.setItem("lockoutUntil", lockoutUntil.toString());

          alert(`Too many failed attempts. Locked for ${lockoutMinutes} minute(s).`);

          lockoutMinutes *= 2;
          localStorage.setItem("lockoutMinutes", lockoutMinutes.toString());

          modal.style.display = "none";
          return;
        }

        alert("Incorrect. Try again.");
        loadChallenge();
      }
    };

    imgContainer.appendChild(img);
  });
}

/* ⭐ FINAL — SAFE VERIFICATION RESULT ⭐ */
window.passVerification = function () {
  localStorage.removeItem("verifyFails");
  localStorage.removeItem("lockoutMinutes");
  localStorage.removeItem("lockoutUntil");

  localStorage.setItem("loggedInUser", window.loginEmail);

  window.location.href = "pm.html";
};
</script>
</body>
</html>
